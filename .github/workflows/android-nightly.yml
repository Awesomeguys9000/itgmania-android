name: Android Nightly

on:
  push:
    branches: [beta]
  pull_request:
    paths:
      - 'android/**'
      - 'extern/SDL/**'
      - 'src/**'
      - '.github/workflows/android-nightly.yml'
  workflow_dispatch:

jobs:
  build-android:
    name: Android (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        
      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
          
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
            
      - name: Make gradlew executable
        working-directory: android
        run: chmod +x gradlew
        
      - name: Build APK (${{ matrix.abi }})
        working-directory: android
        run: |
          # Build only the specific ABI to speed up individual jobs
          ./gradlew assembleRelease \
            -Pabi=${{ matrix.abi }} \
            --no-daemon \
            --stacktrace
            
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: itgmania-android-${{ matrix.abi }}
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
          
  combine-apks:
    name: Combine APKs
    needs: build-android
    runs-on: ubuntu-latest
    
    steps:
      - name: Download all APK artifacts
        uses: actions/download-artifact@v4
        with:
          path: apks
          pattern: itgmania-android-*
          
      - name: List APKs
        run: find apks -name "*.apk" -type f
        
      - name: Upload combined artifact
        uses: actions/upload-artifact@v4
        with:
          name: itgmania-android-all
          path: apks/**/*.apk
          retention-days: 90
